<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Astro Dozi - Uygulamayı İndir</title>
    <link rel="icon" type="image/png" href="assets/astro_dozi_icon_fg.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 420px;
        }
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #a78bfa, #f9a8d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .store-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }
        .store-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1.75rem;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            width: 260px;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .store-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .store-btn.ios {
            background: #fff;
            color: #000;
        }
        .store-btn.android {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
        }
        .store-btn svg { flex-shrink: 0; }
        .note {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/astro_dozi_icon_fg.png" alt="Astro Dozi" class="logo">
        <h1>Astro Dozi</h1>
        <p>Kozmik yolculugun icin uygulamayi indir.<br>Gunluk burc yorumlari, tarot fali, dogum haritasi ve daha fazlasi.</p>
        <div class="store-buttons">
            <a href="https://apps.apple.com/app/astro-dozi/id6746498775" class="store-btn ios">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                App Store
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.bardino.zodi" class="store-btn android">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3.18 23.64c-.35-.2-.56-.58-.56-1.03V1.39c0-.45.21-.83.56-1.03l11.35 11.64L3.18 23.64zm1.4.74l12.58-7.26-2.76-2.83L4.58 24.38zm15.08-10.61c.49.28.79.79.79 1.35 0 .55-.3 1.07-.79 1.35l-2.65 1.53-3.03-3.11 3.03-3.11 2.65 1.53-.01-.54h.01zM4.58-.38L16.4 9.71l-2.76 2.83L1.06-2.72 4.58-.38z"/></svg>
                Google Play
            </a>
        </div>
        <p class="note">Web uzerinden satis hizmeti kaldirilmistir.</p>
    </div>
</body>
</html>
